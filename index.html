<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FAB Life Counter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-ornament left" aria-hidden="true">
        <div class="ornament-inner">
          <span class="motif">✦</span>
          <span class="motif">✦</span>
          <span class="motif">✦</span>
          <span class="motif">✦</span>
          <span class="motif">✦</span>
          <span class="motif">✦</span>
        </div>
      </aside>

      <main class="battlefield" aria-label="Compteur de vie Flesh and Blood">
        <section class="player-panel left-panel" data-player="0" aria-label="Joueur 1">
          <div class="player-header">
            <input class="player-name-input" type="text" value="Joueur 1" id="player-name-1" aria-label="Nom du joueur 1" maxlength="18" />
            <button class="reset-button" type="button" onclick="resetLife(1)">Reset</button>
          </div>

          <div class="life-display" aria-live="polite">
            <button class="zone-button left" type="button" onclick="changeLife(1, -1)" aria-label="Retirer 1 point au joueur 1">
              <span>−</span>
            </button>

            <div class="life-total-wrap">
              <div class="life-total" id="life-p1">20</div>
            </div>

            <button class="zone-button right" type="button" onclick="changeLife(1, 1)" aria-label="Ajouter 1 point au joueur 1">
              <span>+</span>
            </button>
          </div>
        </section>

        <section class="player-panel right-panel" data-player="1" aria-label="Joueur 2">
          <div class="player-header">
            <input class="player-name-input" type="text" value="Joueur 2" id="player-name-2" aria-label="Nom du joueur 2" maxlength="18" />
            <button class="reset-button" type="button" onclick="resetLife(2)">Reset</button>
          </div>

          <div class="life-display" aria-live="polite">
            <button class="zone-button left" type="button" onclick="changeLife(2, -1)" aria-label="Retirer 1 point au joueur 2">
              <span>−</span>
            </button>

            <div class="life-total-wrap">
              <div class="life-total" id="life-p2">20</div>
            </div>

            <button class="zone-button right" type="button" onclick="changeLife(2, 1)" aria-label="Ajouter 1 point au joueur 2">
              <span>+</span>
            </button>
          </div>
        </section>
      </main>

      <aside class="side-ornament right" aria-hidden="true">
        <div class="ornament-inner">
          <span class="motif">✦</span>
          <span class="motif">✦</span>
          <span class="motif">✦</span>
          <span class="motif">✦</span>
          <span class="motif">✦</span>
          <span class="motif">✦</span>
        </div>
      </aside>
    </div>

    <script>
      var p1Life = 20;
      var p2Life = 20;

      function updateLifeDisplay(player) {
        var target = document.getElementById('life-p' + player);
        if (player === 1) {
          target.innerText = p1Life;
        } else if (player === 2) {
          target.innerText = p2Life;
        }
      }

      function changeLife(player, delta) {
        if (player === 1) {
          p1Life = p1Life + delta;
          if (p1Life < 0) {
            p1Life = 0;
          }
          updateLifeDisplay(1);
        } else if (player === 2) {
          p2Life = p2Life + delta;
          if (p2Life < 0) {
            p2Life = 0;
          }
          updateLifeDisplay(2);
        }
      }

      function resetLife(player) {
        if (player === 1) {
          p1Life = 20;
          updateLifeDisplay(1);
        } else if (player === 2) {
          p2Life = 20;
          updateLifeDisplay(2);
        }
      }

      document.getElementById('player-name-1').onblur = function() {
        var value = this.value.trim();
        if (value === '') {
          this.value = 'Joueur 1';
        }
      };

      document.getElementById('player-name-2').onblur = function() {
        var value = this.value.trim();
        if (value === '') {
          this.value = 'Joueur 2';
        }
      };
    </script>
  </body>
</html>
